name: 台水實際查詢
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taiwater-live-check
  cancel-in-progress: false
jobs:
  query:
    if: github.repository == 'yitsewu/taiwan-water' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(gh api repos/yitsewu/taiwan-water/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install release dependencies
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          requirements = json.loads(Path('release/custom_components/taiwater/manifest.json').read_text())['requirements']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *requirements], check=True)
          PY
      - name: Query one bill without publishing private data
        env:
          TAIWATER_MONITOR_WATER_ID: ${{ secrets.TAIWATER_MONITOR_WATER_ID }}
          TAIWATER_MONITOR_CUSTOMER_NAME: ${{ secrets.TAIWATER_MONITOR_CUSTOMER_NAME }}
          TAIWATER_RELEASE: ${{ steps.release.outputs.tag }}
          TAIWATER_RELEASE_ROOT: ${{ github.workspace }}/release
        run: python scripts/live_check.py
